# Nginx configuration for whoisandrewfox.com
# Deploy to: /etc/nginx/sites-available/whoisandrewfox.com
# Enable with: sudo ln -s /etc/nginx/sites-available/whoisandrewfox.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name whoisandrewfox.com;

    root /var/www/whoisandrewfox.com;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logging
    access_log /var/log/nginx/whoisandrewfox.com-access.log;
    error_log /var/log/nginx/whoisandrewfox.com-error.log;
}

# Redirect www to non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.whoisandrewfox.com;
    return 301 http://whoisandrewfox.com$request_uri;
}
