# Nginx configuration for whoisandrewfox.com
# This is the SSL-enabled version managed by Certbot
# Deployed to: /etc/nginx/sites-available/whoisandrewfox.com

server {
    server_name whoisandrewfox.com;

    root /var/www/whoisandrewfox.com;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logging
    access_log /var/log/nginx/whoisandrewfox.com-access.log;
    error_log /var/log/nginx/whoisandrewfox.com-error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/whoisandrewfox.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whoisandrewfox.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirect www to non-www (HTTPS)
server {
    server_name www.whoisandrewfox.com;
    return 301 https://whoisandrewfox.com$request_uri;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/whoisandrewfox.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whoisandrewfox.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP to HTTPS redirect
server {
    if ($host = whoisandrewfox.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name whoisandrewfox.com;
    return 404; # managed by Certbot
}

# HTTP www to HTTPS redirect
server {
    if ($host = www.whoisandrewfox.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name www.whoisandrewfox.com;
    return 404; # managed by Certbot
}
